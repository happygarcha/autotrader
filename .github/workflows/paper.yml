name: paper-trading
# Free 24/7 paper trading: GitHub runs this on a schedule, even with your PC off.
# Uses fake money and public market data only. No secrets needed.
on:
  schedule:
    - cron: "17 * * * *"   # hourly; the bot only acts when a new daily bar has closed
  workflow_dispatch: {}

concurrency: { group: paper-state, cancel-in-progress: false }

permissions:
  contents: write

jobs:
  cycle:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with: { ref: main }
      - uses: actions/checkout@v4
        continue-on-error: true
        with: { ref: paper-state, path: state-branch }
      - uses: actions/setup-python@v5
        with: { python-version: "3.11", cache: pip }
      - run: pip install -e .
      - name: Restore state
        run: |
          mkdir -p state
          [ -f state-branch/paper.json ] && cp state-branch/paper.json state/paper.json || true
      - name: Run one paper cycle
        run: python -m autotrader.paper_cli --config config/paper.json --state state/paper.json --report state/report.md
      - name: Save state to paper-state branch
        run: |
          rm -rf state-branch
          git config user.name "autotrader-bot"; git config user.email "bot@users.noreply.github.com"
          git fetch origin paper-state 2>/dev/null && git checkout paper-state || git checkout --orphan paper-state
          git rm -rf . >/dev/null 2>&1 || true
          cp /dev/null .keep
          git add -f .keep
          mkdir -p out && cp state/paper.json state/report.md . 2>/dev/null || true
          git add -f paper.json report.md
          git commit -m "paper state $(date -u +%FT%TZ)" || echo "no change"
          git push origin paper-state
